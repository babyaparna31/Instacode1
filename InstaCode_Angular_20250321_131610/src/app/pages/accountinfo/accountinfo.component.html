<div class="accountinfo-container">
  <div class="midsection">
    <div class="breadcrumb-container">
      <mic-breadcrumb>
        <mic-breadcrumb-link link="/" icon="home" ariaLabel="Homepage"></mic-breadcrumb-link>
        <mic-breadcrumb-link link="/customer" label="Customer"></mic-breadcrumb-link>
        <mic-breadcrumb-link link="/customer/setup" label="Customer Setup"></mic-breadcrumb-link>
      </mic-breadcrumb>
    </div>

    <h1 class="page-title">Customer Setup</h1>

    <div class="tabs">
      <button mat-button class="tab-button">Information</button>
      <button mat-button class="tab-button">CAM Specs</button>
      <button mat-button class="tab-button">Settings</button>
      <button mat-flat-button class="tab-button active">Michelin National Account Info</button>
      <button mat-button class="tab-button">Associate Dealer Customers</button>
    </div>

    <mat-card class="main-card">
      <h2 class="section-title">Michelin National Account info</h2>

      <div class="button-group">
        <button mat-flat-button color="accent" class="view-button">
          <mat-icon>visibility</mat-icon>
          View FLeets
        </button>

        <button mat-flat-button color="primary" class="edit-button">
          <mat-icon>settings</mat-icon>
          Edit Selection
        </button>

        <button mat-flat-button color="primary" class="save-button">
          <mat-icon>save</mat-icon>
          Save
        </button>
      </div>

      <div class="toggle-section">
        <div class="toggle-group">
          <label class="field-label">Is National Account</label>
          <mat-slide-toggle color="primary" checked></mat-slide-toggle>
          <span class="mandatory-indicator">*</span>
        </div>
      </div>

      <div class="section-container">
        <div class="section-header">
          <mic-icon icon="folder"></mic-icon>
          <h3 class="subsection-title">Fleet Information</h3>
        </div>
        <div class="divider"></div>

        <div class="form-grid">
          <div class="form-container">
            <label class="field-label">Fleet<span class="mandatory-indicator">*</span></label>
            <mat-form-field appearance="fill">
              <input matInput placeholder="Please enter fleet here">
            </mat-form-field>
          </div>

          <div class="form-container">
            <label class="field-label">Fleet Name<span class="mandatory-indicator">*</span></label>
            <mat-form-field appearance="fill">
              <input matInput placeholder="Please enter fleet name here">
            </mat-form-field>
          </div>

          <div class="form-container">
            <label class="field-label">Address</label>
            <mat-form-field appearance="fill">
              <input matInput placeholder="Please enter address here">
            </mat-form-field>
          </div>

          <div class="form-container">
            <label class="field-label">City</label>
            <mat-form-field appearance="fill">
              <input matInput placeholder="Please enter city here">
            </mat-form-field>
          </div>

          <div class="form-container">
            <label class="field-label">State</label>
            <mat-form-field appearance="fill">
              <input matInput placeholder="Please enter state here">
            </mat-form-field>
          </div>

          <div class="form-container">
            <label class="field-label">Ship-to-number</label>
            <mat-form-field appearance="fill">
              <input matInput placeholder="Please enter Ship-to-number here">
            </mat-form-field>
          </div>

          <div class="form-container">
            <label class="field-label">Bill-to-number</label>
            <mat-form-field appearance="fill">
              <input matInput placeholder="Please enter Bill-to-number here">
            </mat-form-field>
          </div>

          <div class="form-container">
            <label class="field-label">DBA Name</label>
            <mat-form-field appearance="fill">
              <input matInput placeholder="Please enter DBA Name here">
            </mat-form-field>
          </div>

          <div class="form-container">
            <label class="field-label">Home Office Number</label>
            <mat-form-field appearance="fill">
              <input matInput placeholder="Please enter home office no here">
            </mat-form-field>
          </div>

          <div class="form-container">
            <label class="field-label">Fleet Home Office Name</label>
            <mat-form-field appearance="fill">
              <input matInput placeholder="Please enter fleet home office name here">
            </mat-form-field>
          </div>
        </div>
      </div>

      <div class="section-container">
        <div class="section-header">
          <mic-icon icon="folder"></mic-icon>
          <h3 class="subsection-title">Parent Company Information</h3>
        </div>
        <div class="divider"></div>

        <div class="form-grid">
          <div class="form-container">
            <label class="field-label">Parent Company Number</label>
            <mat-form-field appearance="fill">
              <input matInput placeholder="Please enter parent company no here">
            </mat-form-field>
          </div>

          <div class="form-container">
            <label class="field-label">Parent Company Name</label>
            <mat-form-field appearance="fill">
              <input matInput placeholder="Please enter parent company name here">
            </mat-form-field>
          </div>

          <div class="form-container">
            <label class="field-label">Category</label>
            <mat-form-field appearance="fill">
              <input matInput placeholder="Please enter category here">
            </mat-form-field>
          </div>
        </div>
      </div>
    </mat-card>
  </div>
</div>
