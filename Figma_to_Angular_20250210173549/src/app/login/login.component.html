<div class="login-container">
    <div class="header">
      <img src="../assets/images/a_322fc3889a9ffb9988f181411fab01ed6a41a168.jpg" alt="CGI Logo" class="logo"/>
    </div>
    
    <div class="login-box">
      <h2 class="welcome">Welcome</h2>
      <h3 class="login-title">Login</h3>
      
      <form #form="ngForm" (ngSubmit)="onSubmit(form)">
        <div class="form-group">
          <label>Please Enter your username or email address <span class="required">*</span></label>
          <input 
            type="text" 
            #usernameInput
            [(ngModel)]="username"
            name="username"
            placeholder="Username or email address"
            required
          />
        </div>
      
        <div class="form-group">
          <label>Enter your Password <span class="required">*</span></label>
          <input 
            type="password" 
            #passwordInput
            [(ngModel)]="password"
            name="password"
            placeholder="Password"
            required
            minlength="8"
          />
        </div>
      
        <div *ngIf="error" class="error-message">
          {{ error }}
        </div>
      
        <button type="submit" class="login-button">Login</button>
      </form>
      
    </div>
  </div>
