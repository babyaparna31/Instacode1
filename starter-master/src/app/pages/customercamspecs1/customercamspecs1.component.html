<div class="customer-cam-specs">
  <!-- Breadcrumb navigation -->
  <div class="breadcrumb-navigation">
    <div class="home-icon">
      <div class="rectangle">
        <mat-icon>home</mat-icon>
      </div>
    </div>
    <div class="customer">Customer</div>
    <mat-icon class="arrow-icon">chevron_right</mat-icon>
    <div class="customer-setup">Customer Setup</div>
  </div>

  <!-- Header section -->
  <div class="header-section">
    <div class="title">Customer Setup</div>
    <div class="tab-navigation">
      <div class="tab">Information</div>
      <button mat-flat-button class="active-tab">CAM Specs</button>
      <div class="tab">Settings</div>
    </div>
  </div>

  <!-- Save button -->
  <button mat-flat-button class="save-button">
    <mat-icon>save</mat-icon>
    Save
  </button>

  <!-- Language selector -->
  <div class="language-selector">
    <div class="fr">FR</div>
    <div class="divider"></div>
    <div class="en">EN</div>
  </div>

  <!-- Main content card -->
  <mat-card class="main-content">
    <mat-card-title class="content-title">Customer Asset Management</mat-card-title>
    
    <!-- Dropdown section -->
    <div class="dropdown-section">
      <mat-form-field appearance="fill" class="dropdown-field">
        <mat-select placeholder="DEFAULT">
          <mat-option value="">DEFAULT</mat-option>
          <mat-option value="option1">Option 1</mat-option>
          <mat-option value="option2">Option 2</mat-option>
          <mat-option value="option3">Option 3</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Radio button section -->
    <div class="radio-section">
      <mat-radio-group>
        <div class="radio-option">
          <mat-radio-button value="lifetime" checked></mat-radio-button>
          <div class="radio-label">Lifetime</div>
        </div>
        <div class="radio-option">
          <mat-radio-button value="repairLimits" checked></mat-radio-button>
          <div class="radio-label">Repair Limits</div>
        </div>
        <div class="radio-option">
          <mat-radio-button value="perRetread"></mat-radio-button>
          <div class="radio-label">Per Retread</div>
        </div>
      </mat-radio-group>
    </div>

    <!-- Info message -->
    <div class="info-message">
      <mat-icon class="info-icon">info</mat-icon>
      <div class="info-text">Clicking on View CAM Spec button will redirect you to CAM Spec menu, you will leave this page.</div>
    </div>

    <!-- Action buttons -->
    <div class="action-buttons">
      <button mat-flat-button class="view-button">
        <mat-icon>visibility</mat-icon>
        View CAM Spec
      </button>
      <button mat-flat-button class="export-button">
        <mat-icon>download</mat-icon>
        Export CAM Spec
      </button>
    </div>

    <!-- Mandatory indicators -->
    <div class="mandatory-indicator-1">*</div>
    <div class="mandatory-indicator-2">*</div>
  </mat-card>
</div>
