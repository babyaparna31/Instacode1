<div class="customercamspecs">
  <div class="navigation-breadcrumb">
    <div class="breadcrumb-container">
      <div class="home-icon">
        <div class="rectangle">
          <mat-icon>home</mat-icon>
        </div>
      </div>
      <div class="customer">Customer</div>
      <mat-icon class="chevron-icon">chevron_right</mat-icon>
      <div class="customer-setup">Customer Setup</div>
      <mat-icon class="chevron-icon">chevron_right</mat-icon>
    </div>
  </div>

  <div class="page-title">Customer Setup</div>
  
  <div class="tabs-container">
    <div class="tab">Information</div>
    <button mat-button class="tab active">CAM Specs</button>
    <div class="tab">Settings</div>
  </div>
  
  <button mat-raised-button class="save-button">
    <mat-icon>save</mat-icon>
    Save
  </button>
  
  <div class="language-selector">
    <div class="language-option">FR</div>
    <div class="divider"></div>
    <div class="language-option">EN</div>
  </div>
  
  <mat-card class="main-content-card">
    <div class="card-title">Customer Asset Management</div>
    
    <div class="form-container">
      <mat-form-field appearance="fill" class="dropdown-field">
        <mat-select placeholder="DEFAULT">
          <mat-option value="">DEFAULT</mat-option>
          <mat-option value="option1">Option 1</mat-option>
          <mat-option value="option2">Option 2</mat-option>
          <mat-option value="option3">Option 3</mat-option>
        </mat-select>
      </mat-form-field>
      
      <div class="radio-group-container">
        <div class="radio-label">Repair Limits</div>
        <mat-radio-group>
          <mat-radio-button [checked]="true" value="lifetime">Lifetime</mat-radio-button>
          <mat-radio-button value="perRetread">Per Retread</mat-radio-button>
        </mat-radio-group>
      </div>
      
      <div class="action-buttons">
        <button mat-raised-button class="view-button">
          <mat-icon>visibility</mat-icon>
          View CAM Spec
        </button>
        <button mat-raised-button class="export-button">
          <mat-icon>file_download</mat-icon>
          Export CAM Spec
        </button>
      </div>
      
      <div class="info-message">
        <mat-icon class="info-icon">info</mat-icon>
        Clicking on View CAM Spec button will redirect you to CAM Spec menu, you will leave this page.
      </div>
      
      <div class="mandatory-note">
        <span class="mandatory-asterisk">*</span>
      </div>
    </div>
  </mat-card>
</div>
