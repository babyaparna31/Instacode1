<div class="customer-asset-management">
  <div class="midsection">
    <div class="breadcrumb">
      <button mat-icon-button class="home-button">
        <mat-icon>home</mat-icon>
      </button>
      <span class="breadcrumb-item">Customer</span>
      <mat-icon>chevron_right</mat-icon>
      <span class="breadcrumb-item active">Customer Setup</span>
    </div>
    
    <h1 class="page-title">Customer Setup</h1>
    
    <mat-tab-group>
      <mat-tab label="Information"></mat-tab>
      <mat-tab label="CAM Specs" selected></mat-tab>
      <mat-tab label="Settings"></mat-tab>
    </mat-tab-group>
    
    <mat-card class="content-card">
      <h2 class="section-title">Customer Asset Management</h2>
      
      <div class="form-container">
        <div class="form-field-wrapper">
          <span class="field-label">CAM Spec Name</span>
          <mat-form-field appearance="fill">
            <mat-select placeholder="DEFAULT">
              <mat-option value="">DEFAULT</mat-option>
              <mat-option value="option1">Option 1</mat-option>
              <mat-option value="option2">Option 2</mat-option>
              <mat-option value="option3">Option 3</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        
        <div class="repair-limits-container">
          <span class="field-label">Repair Limits</span>
          
          <mat-radio-group>
            <div class="radio-option">
              <mat-radio-button value="lifetime" checked>Lifetime</mat-radio-button>
            </div>
            <div class="radio-option">
              <mat-radio-button value="perRetread">Per Retread</mat-radio-button>
            </div>
          </mat-radio-group>
        </div>
        
        <div class="action-buttons">
          <button mat-raised-button color="primary" class="view-button">
            <mat-icon>visibility</mat-icon>
            View CAM Spec
          </button>
          
          <button mat-raised-button class="export-button">
            <mat-icon>download</mat-icon>
            Export CAM Spec
          </button>
        </div>
      </div>
      
      <div class="info-container">
        <mat-icon color="primary">info</mat-icon>
        <span class="info-text">Clicking on View CAM Spec button will redirect you to CAM Spec menu, you will leave this page.</span>
      </div>
    </mat-card>
  </div>
</div>
